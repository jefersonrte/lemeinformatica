name: Deploy Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar em producao
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://lemeinformatica.com.br/pet/

    steps:
      - name: Baixar versao aprovada
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Preparar PHP do Orçamentista
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, fileinfo, dom, libxml, xml, gd, zip
          coverage: none

      - name: Validar Orçamentista 1.2.2
        shell: bash
        run: |
          set -Eeuo pipefail
          composer validate --strict --working-dir=orca-funcional-v1.2.2
          php orca-funcional-v1.2.2/tests/lint.php
          php orca-funcional-v1.2.2/tests/run.php

      - name: Validar configuracao protegida
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          APP_DB_HOST: ${{ secrets.APP_DB_HOST }}
          APP_DB_NAME: ${{ secrets.APP_DB_NAME }}
          APP_DB_USERNAME: ${{ secrets.APP_DB_USERNAME }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -n "$APP_DB_HOST"
          test -n "$APP_DB_NAME"
          test -n "$APP_DB_USERNAME"
          test -n "$APP_DB_PASSWORD"
          test -n "$APP_API_KEY"

      - name: Preparar cliente FTPS
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lftp

      - name: Publicar arquivos rastreados
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_TLS_HOST: srv1543.hstgr.io
          BEFORE_SHA: ${{ github.event.before }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          APP_DB_HOST: ${{ secrets.APP_DB_HOST }}
          APP_DB_NAME: ${{ secrets.APP_DB_NAME }}
          APP_DB_USERNAME: ${{ secrets.APP_DB_USERNAME }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail

          staging="$RUNNER_TEMP/lemeinformatica-deploy"
          file_list="$RUNNER_TEMP/lemeinformatica-files"
          mkdir -p "$staging"
          selected=0

          git ls-files -z > "$file_list"

          while IFS= read -r -d '' file; do
            case "$file" in
              .github/*|.gitignore|README.md|README_USUARIOS.md|backend/README.md|frontend/README.md|pet/README.md|pet/CHANGELOG.md|pet/docs/*|pet/tests/*|orca-funcional-v1.2.2/tests/*|sql/*)
                continue
                ;;
              includes/config.php|includes/database.runtime.php)
                echo "Arquivo privado nao pode fazer parte do deploy."
                exit 1
                ;;
            esac

            mkdir -p "$staging/$(dirname "$file")"
            cp "$file" "$staging/$file"
            selected=$((selected + 1))
          done < "$file_list"

          mkdir -p "$staging/includes"
          export CONFIG_TARGET="$staging/includes/config.php"
          php <<'PHP_CONFIG'
          <?php
          $secretConstants = [
              'DB_HOST' => getenv('APP_DB_HOST'),
              'DB_NAME' => getenv('APP_DB_NAME'),
              'DB_USER' => getenv('APP_DB_USERNAME'),
              'DB_PASS' => getenv('APP_DB_PASSWORD'),
              'API_KEY' => getenv('APP_API_KEY'),
          ];

          if (in_array(false, $secretConstants, true)) {
              fwrite(STDERR, "Configuracao privada incompleta.\n");
              exit(1);
          }

          $content = "<?php\n";
          foreach ($secretConstants as $name => $value) {
              $content .= 'const ' . $name . ' = ' . var_export($value, true) . ";\n";
          }

          $content .= <<<'PHP_DEFAULTS'

          const SESSION_NAME = 'LEME_API_SESSAO';
          const CSRF_SESSION_KEY = 'csrf_token';
          const LOGIN_MAX_ATTEMPTS = 5;
          const LOGIN_LOCK_MINUTES = 15;
          const SESSION_IDLE_LIMIT_SECONDS = 1800;
          const SESSION_REGENERATE_SECONDS = 600;
          const ALLOWED_ORIGINS = [
              'https://lemesolucoesemti.com.br',
              'https://www.lemesolucoesemti.com.br',
          ];
          const USER_SYNC_URL = 'https://lemesolucoesemti.com.br/api/usuarios-sync.php';
          PHP_DEFAULTS;

          $target = getenv('CONFIG_TARGET');
          if (!is_string($target) || file_put_contents($target, $content) === false) {
              fwrite(STDERR, "Falha ao gerar configuracao privada.\n");
              exit(1);
          }
          chmod($target, 0600);
          PHP_CONFIG
          selected=$((selected + 1))

          orca_dir="$staging/orca-funcional-v1.2.2"
          if [[ -d "$orca_dir" ]]; then
            composer install --working-dir="$orca_dir" --no-dev --prefer-dist --no-interaction --optimize-autoloader
            export ORCA_RUNTIME_TARGET="$orca_dir/config/runtime.php"
            php <<'PHP_ORCA_CONFIG'
          <?php
          $config = [
              'app' => [
                  'url' => 'https://lemeinformatica.com.br/orca-funcional-v1.2.2',
                  'environment' => 'production',
              ],
              'database' => [
                  'host' => getenv('APP_DB_HOST'),
                  'port' => 3306,
                  'name' => getenv('APP_DB_NAME'),
                  'user' => getenv('APP_DB_USERNAME'),
                  'pass' => getenv('APP_DB_PASSWORD'),
                  'prefix' => 'orca12_',
              ],
              'security' => [
                  'migration_key' => getenv('APP_API_KEY'),
                  'session_name' => 'LEME_ORCA122_SESSION',
                  'secure_cookies' => true,
              ],
              'demo' => ['enabled' => true],
          ];
          file_put_contents(
              getenv('ORCA_RUNTIME_TARGET'),
              "<?php\ndeclare(strict_types=1);\nreturn " . var_export($config, true) . ";\n"
          );
          chmod(getenv('ORCA_RUNTIME_TARGET'), 0600);
          PHP_ORCA_CONFIG
            selected=$((selected + 1))
          fi

          cd "$staging"

          printf '%s %s\n' "$FTP_SERVER" "$FTP_TLS_HOST" |
            sudo tee -a /etc/hosts >/dev/null

          # A Hostinger pode encerrar a sessão FTPS com código 1 depois de
          # concluir o espelhamento. Os testes HTTP abaixo continuam sendo
          # obrigatórios e impedem aprovar uma publicação incompleta.
          set +e
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "ftp://$FTP_TLS_HOST" <<'LFTP_COMMANDS'
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 30
          set net:reconnect-interval-base 3
          mirror --reverse --transfer-all --overwrite --verbose --no-perms --no-umask --parallel=1 ./orca-funcional-v1.2.2 /orca-funcional-v1.2.2
          put -O / index.php
          mirror --reverse --transfer-all --overwrite --verbose --no-perms --no-umask --parallel=1 ./ /
          bye
          LFTP_COMMANDS
          lftp_exit=$?
          set -e
          if (( lftp_exit != 0 )); then
            echo "::warning::FTPS encerrou com codigo $lftp_exit; validando o resultado publicado por HTTP."
          fi

          curl --silent --show-error --fail --max-time 30 \
            -c .orca120.cookies \
            https://lemeinformatica.com.br/orca-funcional-v1.2.0/login.php \
            -o .orca120-login.html
          test "$(php -r '$h=file_get_contents(".orca120-login.html"); preg_match("~name=\"csrf_token\" value=\"([a-f0-9]{64})\"~",$h,$m); echo $m[1]??"";')" != ""
          curl --silent --show-error --fail --max-time 30 \
            -b .orca120.cookies \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'csrf_token=token-antigo-simulado&email=teste%40exemplo.com&senha=senha-invalida' \
            https://lemeinformatica.com.br/orca-funcional-v1.2.0/login.php \
            -o .orca120-stale.html
          grep -Fq 'informe a senha novamente.' .orca120-stale.html
          test "$(php -r '$h=file_get_contents(".orca120-stale.html"); preg_match("~name=\"csrf_token\" value=\"([a-f0-9]{64})\"~",$h,$m); echo $m[1]??"";')" != ""

          orca_migration=""
          for attempt in $(seq 1 10); do
            if curl --silent --show-error --fail --max-time 45 \
              -X POST -H "X-MIGRATION-KEY: $APP_API_KEY" \
              https://lemeinformatica.com.br/orca-funcional-v1.2.2/migrate.php \
              -o .orca-migration.json; then
              orca_migration="$(php -r '$d=json_decode(file_get_contents(".orca-migration.json"),true); echo is_array($d)&&($d["ok"]??false)?($d["version"]??""):"";' || true)"
            fi
            [[ "$orca_migration" == "1.2.2" ]] && break
            sleep 3
          done
          test "$orca_migration" = "1.2.2"

          curl --silent --show-error --fail --max-time 60 \
            -X POST -H "X-MIGRATION-KEY: $APP_API_KEY" \
            https://lemeinformatica.com.br/orca-funcional-v1.2.2/smoke.php \
            -o .orca-smoke.json
          test "$(php -r '$d=json_decode(file_get_contents(".orca-smoke.json"),true); echo is_array($d)&&($d["ok"]??false)?"ok":"fail";')" = "ok"
          test "$(curl --silent --show-error --fail --max-time 30 \
            https://lemeinformatica.com.br/orca-funcional-v1.2.2/health.php | \
            php -r '$d=json_decode(stream_get_contents(STDIN),true); echo is_array($d)&&($d["ok"]??false)&&($d["version"]??"")==="1.2.2"?"ok":"fail";')" = "ok"

          expected_version="$(tr -d '\r\n' < "$GITHUB_WORKSPACE/pet/VERSION")"
          migration_version=""
          for attempt in $(seq 1 10); do
            if curl --silent --show-error --fail --max-time 45 \
              -X POST -H "X-API-KEY: $APP_API_KEY" \
              https://lemeinformatica.com.br/pet/migrate.php \
              -o .migration.json; then
              migration_version="$(php -r '$data = json_decode(file_get_contents(".migration.json"), true); echo is_array($data) && ($data["ok"] ?? false) === true ? ($data["versao_banco"] ?? "") : "";' || true)"
            fi
            if [[ "$migration_version" == "$expected_version" ]]; then
              break
            fi
            sleep 3
          done
          test "$migration_version" = "$expected_version"

          published_version=""

          for attempt in $(seq 1 10); do
            if curl --silent --show-error --fail --max-time 30 \
              -H "X-API-KEY: $APP_API_KEY" \
              https://lemeinformatica.com.br/pet/health.php \
              -o .health.json; then
              published_version="$(php -r '$data = json_decode(file_get_contents(".health.json"), true); echo is_array($data) && isset($data["versao_pet"]) ? $data["versao_pet"] : "";' || true)"
            fi

            if [[ "$published_version" == "$expected_version" ]]; then
              break
            fi
            sleep 3
          done

          test "$published_version" = "$expected_version"
          test "$(curl --silent --show-error --fail --max-time 30 \
            https://lemeinformatica.com.br/PROJECT_HUB_VERSION | tr -d '\r\n')" = "1.4.0"
          echo "$selected arquivos sincronizados. Versao $published_version confirmada."
