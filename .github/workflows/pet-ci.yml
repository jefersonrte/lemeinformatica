name: Pet CI

on:
  push:
    branches:
      - main
      - "feature/pet-*"
      - "feat/pet-*"
      - feat/project-hub-menu
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - "8.2"
          - "8.4"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, fileinfo, json
          coverage: none
          tools: none

      - name: Lint PHP
        shell: bash
        run: |
          find . -type f -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l
          php .github/scripts/test-orca120-csrf.php

  frontend:
    name: Frontend and repository safety
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript
        run: |
          node --check pet/frontend/js/app.js
          node --check pet/frontend/js/modules/commerce.js
          node --check pet/tests/production-smoke.mjs
          node --check frontend/js/home.js
          node --check frontend/js/usuarios.js

      - name: Check Pet 1.1 contracts
        shell: bash
        run: |
          grep -q "CREATE TABLE IF NOT EXISTS pet_banho_tosa_agendamentos" pet/sql/migrations/002_v1_1_0_pet_estetica_comercial.sql
          grep -q "CREATE TABLE IF NOT EXISTS pet_produtos" pet/sql/migrations/002_v1_1_0_pet_estetica_comercial.sql
          grep -q "CREATE TABLE IF NOT EXISTS pet_vendas" pet/sql/migrations/002_v1_1_0_pet_estetica_comercial.sql
          grep -q "CREATE TABLE IF NOT EXISTS pet_sso_tokens" pet/sql/migrations/003_v1_1_1_pet_sso_dashboard.sql
          grep -q "data-view=\"banho_tosa\"" pet/index.php
          grep -q "data-view=\"produtos\"" pet/index.php
          grep -q "data-view=\"vendas\"" pet/index.php
          test -s pet/api/relatorios.php
          test -s pet/api/vendas.php
          test -s pet/api/sso.php
          test -s pet/sso-start.php

      - name: Check project hub links
        shell: bash
        run: |
          test "$(tr -d '\r\n' < PROJECT_HUB_VERSION)" = "1.4.0"
          grep -q "https://lemeinformatica.com.br/orca-funcional-v1.2.1/" index.php
          grep -q "https://lemeinformatica.com.br/orca-funcional-v1.2.0/" index.php
          grep -q "https://lemeinformatica.com.br/orca-v1.2.0/" index.php
          grep -q "https://lemeinformatica.com.br/orca/" index.php
          grep -q "data-project-filter" index.php
          grep -q "https://lemeinformatica.com.br/pet/" index.php
          grep -q "https://lemesolucoesemti.com.br/pet/" index.php
          grep -q "https://lemesolucoesemti.com.br/powerbi/" index.php
          grep -q "https://lemeinformatica.com.br/gov/" index.php
          grep -q "https://lemesolucoesemti.com.br/gov/" index.php
          grep -q "https://lemesolucoesemti.com.br/invest/" index.php
          grep -q "https://lemesolucoesemti.com.br/cloud/" index.php
          grep -q "https://lemeinformatica.com.br/pet/login.php" index.php
          test -s gov/index.php
          test -s gov/lib.php
          test -s gov/api/deputados.php
          test ! -e gov/private/config.php
          grep -q "powerbi_sso" login.php
          grep -q "next=powerbi" pet/sso-start.php
          grep -q "pet_sso_destination" pet/sso-start.php
          grep -q "PET_PUBLIC_BASE" index.php
          test -s sso-start.php
          test -s api/sso.php
          test -s api/relatorios.php
          test -s includes/user-provisioning.php
          grep -q "provision_user_in_integrated_systems" usuarios.php
          grep -q "usuarios-sync.php" includes/user-provisioning.php

      - name: Reject runtime secrets
        shell: bash
        run: |
          if git ls-files \
            | grep -E '(^|/)(config\.php|database\.runtime\.php|\.env)$' \
            | grep -v -E '^orca-funcional-v1\.2\.[01]/config/config\.php$'; then
            echo "Runtime secret file is tracked."
            exit 1
          fi
          if git grep -nE '[A-Fa-f0-9]{48,}'; then
            echo "Possible long-form secret is tracked."
            exit 1
          fi
